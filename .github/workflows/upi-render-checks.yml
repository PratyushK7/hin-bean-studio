name: UPI local renderer checks

on:
  push:
    paths:
      - "projects/upi-behind-the-scan/**"
      - ".github/workflows/upi-render-checks.yml"
  pull_request:
    paths:
      - "projects/upi-behind-the-scan/**"
      - ".github/workflows/upi-render-checks.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/upi-behind-the-scan/render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm install
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript and Python syntax
        run: |
          node --check scene.js
          node --check render.mjs
          python -m py_compile build.py ../voice/generate_audio.py ../voice/download_model.py
          python -c "import json; a=json.load(open('../script.json', encoding='utf-8')); b=json.load(open('../script-tts.json', encoding='utf-8')); assert len(a)==len(b)==83; print(f'{len(a)} aligned narration lines')"
      - name: Render all 16 scene previews
        run: |
          npm run preview -- --out ./stills
          python -c "from pathlib import Path; p=list(Path('stills').glob('scene-*.png')); print(f'{len(p)} scene previews'); assert len(p)==16"
      - name: Install FFmpeg for mux smoke test
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Smoke-test video and audio mux
        run: |
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=2 -c:a pcm_s16le /tmp/renderer-test.wav
          node render.mjs --audio /tmp/renderer-test.wav --out /tmp/renderer-test.mp4 --fps 12
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 /tmp/renderer-test.mp4 | grep -q "h264,1920,1080"
