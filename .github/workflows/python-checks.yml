name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app tools
      - name: Create planner fixture
        run: python tools/build_planner.py
      - name: Run core tests
        run: python tools/test_core.py
      - name: Run YouTube analytics adapter tests
        run: python tools/test_ytdata.py
